name: Collect election results data

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "*/20 * * * *"

# never let two scrapes overlap
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7

      - name: Download and format the data
        run: ./scripts/collect.sh ./general 4348

      - name: Update snapshots and timeframes
        continue-on-error: true # never let a problem block committing fresh data
        run: python3 update_snapshots.py ./general

      - name: Get a timestamp
        id: timestamp
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Commit results.json to GitHub
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Latest results: ${{ steps.timestamp.outputs.value }}"
          file_pattern: "*.json"
          skip_fetch: true
